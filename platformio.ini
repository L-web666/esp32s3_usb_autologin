; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
upload_speed = 921600
extra_scripts = 
    pre:tools/merge.py

; upload_protocol = espota
; upload_port = passtxt.local
; upload_flags =
;    --port=3232
;    --auth=password

[env:esp32-s3-devkitc-1]
;platform = espressif32@6.9.0
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
board_build.filesystem = littlefs

; ---------------------------------------------------------------------------
; 离线/慢网络环境下的包来源（可选）
; ---------------------------------------------------------------------------
; 本机直连 GitHub / PIO registry 只有约 14 KB/s，1GB 工具链要下几小时。
; 因此工具链和框架包是手工从镜像下载、再让 PIO 从本地文件安装的。
; 需要离线构建时，取消下面注释（路径按你存放 dl/ 的位置修改）。
;
; platform_packages =
;     toolchain-xtensa-esp32s3@file://C:/esp/dl/toolchain-xtensa-esp32s3-windows_x86-8.4.0+2021r2-patch5.tar.gz
;     toolchain-riscv32-esp@file://C:/esp/dl/toolchain-riscv32-esp-windows_x86-8.4.0+2021r2-patch5.tar.gz
;     platformio/framework-arduinoespressif32@file://C:/esp/dl/framework-arduinoespressif32-3.20017.0.tar.gz
;     platformio/tool-esptoolpy@file://C:/esp/dl/tool-esptoolpy-1.40501.0.tar.gz
;     platformio/tool-mklittlefs@file://C:/esp/dl/tool-mklittlefs-windows_amd64-1.203.210628.tar.gz
;     platformio/tool-mkspiffs@file://C:/esp/dl/tool-mkspiffs-windows-2.230.0.tar.gz

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I src/WebHandler
    -I src/TimeHandler
    -I src/Images
    -D SOFTWARE_VERSION=\"V1.0.10\"
    -D ENABLE_LITTLEFS_HANDLER
    -D ENABLE_TIME_HANDLER
    -D ENABLE_LED_HANDLER
    -D ENABLE_BUTTON_HANDLER
    -D ENABLE_GFX_HANDLER
    ;-D ENABLE_SYSTEM_MONITOR
    -D ENABLE_DUCKYSCRIPT_HANDLER
    -D ENABLE_CRYPTO_HANDLER
    -D ENABLE_DEVICE_HANDLER
    -D ENABLE_JIGGLE_HANDLER
    -D ENABLE_AUTOLOGIN_HANDLER
    -D ENABLE_SERIALCONFIG_HANDLER

    ; ---------- 以下功能已关闭（精简为"键盘 + 自动登录"）----------
    ; 这四项在无网络环境下实测会让固件在 init 阶段 abort() 崩溃
    ; （coredump: abort() at nvs::Page::getSeqNumber，任务 loopTask），
    ; 一旦崩溃重启，自动登录就永远执行不到，所以默认关闭。
    ; 需要网页配置/WiFi/MQTT 时再逐项打开，并确保芯片能连上 WiFi。
    ;-D ENABLE_IMPROV_WIFI_HANDLER
    ;-D ENABLE_WEB_HANDLER
    ;-D ENABLE_MQTT_HANDLER
    ;-D ENABLE_REMOTE_DEBUG_HANDLER

    ; ############# Heavy resources #############
    ;-D ENABLE_BLUETOOTH_HANDLER
    ;-D ENABLE_OTA_HANDLER
    ; ############# Heavy resources #############
    ;-D ENABLE_TEMPLATE_HANDLER
    ;-D ENABLE_CRON_HANDLER
    ;-D ENABLE_DOWNLOAD_HANDLER
    ;-D ENABLE_AES_HANDLER
    ;-D ENABLE_SCRIPT_HANDLER